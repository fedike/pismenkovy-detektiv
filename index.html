<title>Písmenkový detektív</title>
<!--
  PÍSMENKOVÝ DETEKTÍV
  Písané písmená používajú font Comenia Script Pro, ktorý je vložený priamo
  v tomto súbore (base64) – hra funguje úplne offline aj bez fontového súboru.
  AK CHCEŠ POUŽIŤ INÝ / NOVÝ FONTOVÝ SÚBOR: umiestni ho vedľa tohto HTML
  pod názvom „ComeniaScriptPro.ttf" – aplikácia ho použije automaticky
  namiesto vloženej verzie (miesto na pridanie fontu je teda priečinok
  s týmto súborom). Ak súbor chýba, hra pokojne používa vložený font.
-->
<style>
:root{
  --ink:#37474f; --accent:#1e88e5;
  --ok:#1b5e20; --okbg:#c8e6c9; --okline:#66bb6a;
  --bad:#b71c1c; --badbg:#ffcdd2; --badline:#ef9a9a;
  --line:#cfd8dc; --card:#ffffff; --bg:#f2f6f4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  font-family:'Trebuchet MS','Verdana','DejaVu Sans',sans-serif;
  background:linear-gradient(180deg,#f6faf7 0%,#e9f2ec 100%);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
#app{
  height:100dvh; display:grid;
  grid-template-columns:1fr auto;
  grid-template-rows:auto 1fr;
  grid-template-areas:"top top" "board bat";
}

/* ============ Horný pás ============ */
#topbar{
  grid-area:top; position:relative;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  gap:8px; padding:8px clamp(8px,2vw,20px);
  background:#fff; box-shadow:0 2px 10px rgba(55,71,79,.10); z-index:20;
}
#gameTitle{
  display:flex; align-items:center; gap:8px;
  font-weight:bold; color:#546e7a; font-size:clamp(.85rem,2.1vw,1.3rem);
}
#gameTitle svg{width:1.25em;height:1.25em;flex:none}
#targetBox{
  display:flex; align-items:center; gap:clamp(6px,1.5vw,14px);
  background:#fff8e1; border:3px dashed #ffca28; border-radius:16px;
  padding:3px clamp(8px,2vw,18px);
}
#targetBox .lbl{font-size:clamp(.78rem,2vw,1.1rem); color:#795548; line-height:1.15}
#targetBox .hint{display:block; font-size:clamp(.6rem,1.4vw,.78rem); color:#a1887f; font-weight:normal}
#targetLetter{
  font-family:'Trebuchet MS','Verdana','DejaVu Sans',sans-serif;
  font-weight:bold; font-size:clamp(1.8rem,6vw,3.2rem);
  color:var(--accent); line-height:1;
}
#roundInfo{font-size:clamp(.78rem,2vw,1.05rem); color:#78909c; font-weight:bold; white-space:nowrap}

/* Smajlík – malý banner hore, neprikryje rad písmen */
#smiley{
  position:absolute; left:50%; top:104%;
  transform:translateX(-50%) translateY(-8px) scale(.9);
  z-index:40; display:flex; align-items:center; gap:8px;
  background:#fff; border-radius:999px; padding:5px 16px 5px 8px;
  box-shadow:0 4px 16px rgba(55,71,79,.20);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
#smiley.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}
#smileyFace svg{width:34px;height:34px;display:block}
#smileyText{font-weight:bold; color:var(--ok); font-size:clamp(.9rem,2.4vw,1.2rem); white-space:nowrap}

/* ============ Plocha s písmenami ============ */
#board{grid-area:board; display:flex; align-items:center; justify-content:center; min-height:0; padding:clamp(6px,1.8vh,22px) clamp(6px,1.6vw,22px)}
#letters{display:grid; grid-template-columns:repeat(10,1fr); gap:clamp(5px,1vw,14px); width:100%; max-width:1500px}
.tile{
  aspect-ratio:3/4; width:100%;
  border:3px solid var(--line); border-radius:clamp(10px,1.3vw,20px);
  background:var(--card); box-shadow:0 3px 7px rgba(55,71,79,.12);
  display:flex; align-items:center; justify-content:center;
  font-weight:bold; color:var(--ink); cursor:pointer; padding:0; line-height:1;
  touch-action:manipulation;
  transition:transform .12s, background-color .2s, border-color .2s, color .2s;
  animation:tileIn .45s backwards;
}
.tile:active{transform:scale(.94)}
.tile.print{font-family:'Trebuchet MS','Verdana','DejaVu Sans',sans-serif; font-size:clamp(1.9rem,min(6.8vw,13vh),8rem)}
.tile.script{font-family:'Comenia Script','Comic Sans MS',cursive; font-weight:normal; font-size:clamp(2rem,min(7.4vw,14vh),8.5rem)}
.tile.ok{background:var(--okbg); border-color:var(--okline); color:var(--ok)}
.tile.bad{background:var(--badbg); border-color:var(--badline); color:var(--bad); animation:shake .35s}
@keyframes tileIn{from{opacity:0; transform:translateY(16px) scale(.5) rotate(-10deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#letters.mixing .tile{animation:mixOut .3s forwards}
@keyframes mixOut{to{opacity:0; transform:scale(.4) rotate(10deg)}}

/* ============ Batéria ============ */
#batteryWrap{
  grid-area:bat; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:clamp(8px,1.8vh,20px) clamp(8px,1.4vw,18px);
}
#batNub{width:28px; height:12px; background:#90a4ae; border-radius:6px 6px 0 0; flex:none}
#battery{
  display:flex; flex-direction:column; align-items:stretch;
  width:clamp(46px,4.6vw,70px); height:min(58dvh,540px);
  background:#fff; border:3px solid #90a4ae; border-radius:14px; padding:7px 6px;
}
#batCells{display:flex; flex-direction:column-reverse; gap:5px; flex:1; min-height:0}
.cell{flex:1; min-height:0; background:#eceff1; border:2px solid #cfd8dc; border-radius:6px; transition:background-color .3s, border-color .3s, box-shadow .3s}
.cell.lit{background:var(--okline); border-color:#43a047; box-shadow:inset 0 0 4px rgba(255,255,255,.65)}
#battery.full .cell{animation:beacon .7s infinite alternate}
@keyframes beacon{
  from{background:#7cb342; border-color:#558b2f}
  to{background:#2e7d32; border-color:#1b5e20; box-shadow:0 0 18px 6px rgba(102,187,106,.75)}
}
#batLabel{font-size:clamp(.72rem,1.8vw,.95rem); color:#90a4ae; font-weight:bold}

/* ============ Uzavretie hry ============ */
#finalOverlay{
  position:fixed; inset:0; z-index:100; display:none;
  align-items:center; justify-content:center;
  background:rgba(255,255,255,.45);
}
#finalOverlay.show{display:flex}
#finalBox{
  position:relative; overflow:hidden; max-width:92vw; text-align:center;
  background:#fff; border-radius:26px;
  padding:clamp(24px,5vh,48px) clamp(28px,6vw,64px);
  box-shadow:0 10px 40px rgba(55,71,79,.28);
}
#finalBox h1{margin:.1em 0 .15em; font-size:clamp(2rem,7vw,3.6rem); color:var(--ok)}
#finalBox p{margin:.2em 0 1em; color:#607d8b; font-size:clamp(1rem,3vw,1.35rem)}
#newGameBtn{
  font:inherit; font-weight:bold; font-size:clamp(1.2rem,3.5vw,1.7rem);
  color:#fff; background:#43a047; border:none; border-radius:999px;
  padding:.5em 1.6em; cursor:pointer; touch-action:manipulation;
  box-shadow:0 4px 14px rgba(67,160,71,.45); transition:transform .1s;
}
#newGameBtn:active{transform:scale(.95)}
#confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none}
.cf{position:absolute; top:-24px; border-radius:2px; animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}

/* ============ Menšia / na výšku ============ */
@media (max-width:760px), (orientation:portrait){
  #app{grid-template-columns:1fr; grid-template-rows:auto auto 1fr; grid-template-areas:"top" "bat" "board"}
  #batteryWrap{flex-direction:row; gap:12px; padding:6px 14px}
  #battery{flex-direction:row; align-items:stretch; width:min(100%,520px); height:clamp(34px,7vw,52px); order:1}
  #batCells{flex-direction:row}
  #batNub{order:2; width:12px; height:44%; align-self:center; border-radius:0 6px 6px 0}
  #batLabel{order:3}
  #letters{grid-template-columns:repeat(5,1fr); gap:clamp(6px,1.6vw,14px)}
  .tile.print{font-size:clamp(2.3rem,11vw,5rem)}
  .tile.script{font-size:clamp(2.5rem,12vw,5.4rem)}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="gameTitle">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="42" cy="42" r="26" fill="none" stroke="#546e7a" stroke-width="9"/><line x1="62" y1="62" x2="86" y2="86" stroke="#546e7a" stroke-width="11" stroke-linecap="round"/></svg>
      <span>Písmenkový detektív</span>
    </div>
    <div id="targetBox">
      <span class="lbl">Nájdi písmeno<span class="hint">Klikni na všetky písmená, ktoré sú ako toto</span></span>
      <span id="targetLetter">O</span>
    </div>
    <div id="roundInfo">Kolo 1 z 10</div>
    <div id="smiley"><span id="smileyFace"></span><span id="smileyText"></span></div>
  </header>
  <main id="board"><div id="letters"></div></main>
  <aside id="batteryWrap">
    <div id="batNub"></div>
    <div id="battery"><div id="batCells"></div></div>
    <div id="batLabel">Batéria</div>
  </aside>
  <div id="finalOverlay">
    <div id="finalBox">
      <div id="confetti"></div>
      <h1>Hotovo!</h1>
      <p>Našiel si písmená v všetkých 10 kolách a batéria je plná!</p>
      <button id="newGameBtn" type="button">Nová hra</button>
    </div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const $$=s=>Array.from(document.querySelectorAll(s));
const LETTERS=['O','S','B','U','A'];
const TOTAL_ROUNDS=10, TILES=10;

let FAST=false; // skrátené čakania pre selftest
const wait=(ms,fn)=>setTimeout(fn,FAST?Math.min(ms,40):ms);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
const rand=n=>Math.floor(Math.random()*n);

/* ============ Smajlík banner ============ */
const SMILEY={
  good:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fdd835" stroke="#f9a825" stroke-width="4"/><circle cx="36" cy="42" r="5" fill="#37474f"/><circle cx="64" cy="42" r="5" fill="#37474f"/><path d="M32 58 Q50 76 68 58" fill="none" stroke="#37474f" stroke-width="5" stroke-linecap="round"/></svg>',
  info:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#90caf9" stroke="#64b5f6" stroke-width="4"/><circle cx="36" cy="42" r="5" fill="#263238"/><circle cx="64" cy="42" r="5" fill="#263238"/><line x1="34" y1="68" x2="66" y2="68" stroke="#263238" stroke-width="5" stroke-linecap="round"/></svg>'
};
let smileyTimer=null;
function smiley(kind,text){
  const el=$('smiley');
  $('smileyFace').innerHTML=SMILEY[kind];
  $('smileyText').textContent=text;
  el.classList.remove('good','info');
  el.classList.add('show',kind);
  if(smileyTimer)clearTimeout(smileyTimer);
  smileyTimer=setTimeout(()=>el.classList.remove('show'),FAST?300:1800);
}
const PRAISE=['Správne!','Výborne!','Super!','Presne tak!','Bravo!','Trefa!','Skvelé!'];

/* ============ Podoby písmen ============ */
function forms(l){
  return [
    {ch:l, script:false},                 // veľké tlačené
    {ch:l.toLowerCase(), script:false},   // malé tlačené
    {ch:l, script:true},                  // veľké písané
    {ch:l.toLowerCase(), script:true}     // malé písané
  ];
}

/* ============ Herný stav ============ */
const state={round:1,target:'',tiles:[],locked:false,prevKey:'',correctLeft:0};

function pickTarget(prev){
  let l;
  do{l=LETTERS[rand(LETTERS.length)]}while(l===prev&&Math.random()<.8);
  return l;
}
function positionsOf(tiles){return tiles.map((t,i)=>t.ok?i:-1).filter(i=>i>=0)}

function buildRound(){
  state.target=pickTarget(state.target);
  const n=2+rand(4); // 2 až 5 správnych
  const f4=shuffle(forms(state.target));
  const correct=(n<=4)?f4.slice(0,n):f4.concat([f4[rand(4)]]);
  const wrongPool=[];
  LETTERS.forEach(l=>{if(l!==state.target)wrongPool.push(...forms(l))});
  const wrong=shuffle(wrongPool).slice(0,TILES-n);
  let tiles,tries=0,pos;
  do{
    tiles=shuffle(correct.map(f=>({f,ok:true,done:false})).concat(wrong.map(f=>({f,ok:false,done:false}))));
    tries++;
    pos=positionsOf(tiles);
    var contig=pos.every((p,i)=>i===0||p===pos[i-1]+1);
    // správne písmená nemajú byť vždy vedľa seba ani na rovnakých pozíciách
    var bad=(n>=3&&contig)||(n===2&&contig&&tries<=25)||pos.join(',')===state.prevKey;
  }while(bad&&tries<60);
  state.tiles=tiles;
  state.correctLeft=n;
  state.locked=false;
  state.prevKey=pos.join(',');
  render();
}

function render(){
  $('targetLetter').textContent=state.target;
  $('roundInfo').textContent='Kolo '+state.round+' z '+TOTAL_ROUNDS;
  const box=$('letters'); box.innerHTML='';
  state.tiles.forEach((t,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='tile '+(t.f.script?'script':'print');
    b.textContent=t.f.ch;
    b.style.animationDelay=(i*45)+'ms';
    b.addEventListener('click',()=>clickTile(i));
    box.appendChild(b);
  });
}

function clickTile(i){
  if(state.locked)return;
  const t=state.tiles[i];
  if(!t||t.done)return; // označené písmeno sa nedá zmeniť ani označiť znova
  t.done=true;
  const el=$('letters').children[i];
  if(t.ok){
    el.classList.remove('bad');
    el.classList.add('ok');
    state.correctLeft--;
    if(state.correctLeft===0)completeRound();
  }else{
    el.classList.add('bad');
  }
}

function completeRound(){
  state.locked=true;
  smiley('good',PRAISE[rand(PRAISE.length)]);
  lightCell(state.round-1);
  wait(1300,()=>{
    if(state.round>=TOTAL_ROUNDS){finishGame();return}
    state.round++;
    dealNewRound();
  });
}

function dealNewRound(){
  const box=$('letters');
  box.classList.add('mixing');
  wait(300,()=>{
    buildRound();
    box.classList.remove('mixing');
  });
}

function lightCell(i){const c=$('cell'+i);if(c)c.classList.add('lit')}

function finishGame(){
  $('battery').classList.add('full');
  confettiBurst();
  $('finalOverlay').classList.add('show');
}

function newGame(){
  $('finalOverlay').classList.remove('show');
  $('battery').classList.remove('full');
  for(let i=0;i<TOTAL_ROUNDS;i++){const c=$('cell'+i);if(c)c.classList.remove('lit')}
  state.round=1; state.target=''; state.prevKey='';
  buildRound();
}

function confettiBurst(){
  const c=$('confetti'); c.innerHTML='';
  const colors=['#ef5350','#ffca28','#66bb6a','#42a5f5','#ab47bc','#26c6da'];
  for(let i=0;i<60;i++){
    const p=document.createElement('i'); p.className='cf';
    p.style.left=rand(100)+'%';
    p.style.background=colors[rand(colors.length)];
    p.style.width=(6+rand(8))+'px';
    p.style.height=(10+rand(10))+'px';
    p.style.animationDuration=(2.2+Math.random()*2)+'s';
    p.style.animationDelay=(Math.random()*1.5)+'s';
    c.appendChild(p);
  }
}

$('newGameBtn').addEventListener('click',newGame);
(function(){
  const bc=$('batCells');
  for(let i=0;i<TOTAL_ROUNDS;i++){
    const c=document.createElement('div');
    c.className='cell'; c.id='cell'+i;
    bc.appendChild(c);
  }
})();

/* ============ Štart (počkať na font) ============ */
let started=false;
function start(){if(started||state.tiles.length)return;started=true;newGame()}
if(document.fonts&&document.fonts.load){
  document.fonts.load('1em "Comenia Script"');
  if(document.fonts.ready){document.fonts.ready.then(start)}
  setTimeout(start,1200);
}else{start()}

window.__game={S:state,LETTERS,TOTAL_ROUNDS,buildRound,clickTile,newGame,setFast:v=>FAST=!!v};

/* ============ selftest ============ */
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function selftest(){
  FAST=true;
  const lines=[]; const ok=(n,c)=>lines.push((c?'PASS':'FAIL')+': '+n);
  try{
    await document.fonts.ready; await sleep(60);
    ok('font Comenia Script loaded',document.fonts.check('1em "Comenia Script"'));

    // 30 vygenerovaných kôl – štruktúra
    let structOk=true,cntBad=0,diacritics=0,mixPrint=false,mixScript=false;
    const posSets=new Set(); let contigCount=0;
    const S=window.__game.S;
    for(let r=0;r<30;r++){
      window.__game.buildRound();
      const tiles=S.tiles,target=S.target;
      const n=tiles.filter(t=>t.ok).length;
      if(tiles.length!==10)structOk=false;
      if(!LETTERS.includes(target))structOk=false;
      if(n<2||n>5)cntBad++;
      tiles.forEach(t=>{
        const isT=t.f.ch.toLowerCase()===target.toLowerCase();
        if(isT!==t.ok)structOk=false;
        if(!'OSBUAosbua'.includes(t.f.ch)||t.f.ch.length!==1)diacritics++;
        if(t.ok&&t.f.script)mixScript=true;
        if(t.ok&&!t.f.script)mixPrint=true;
      });
      const pos=tiles.map((t,i)=>t.ok?i:-1).filter(i=>i>=0);
      posSets.add(pos.join(','));
      if(n>=3&&pos.every((p,i)=>i===0||p===pos[i-1]+1))contigCount++;
    }
    ok('30 kôl: presne 10 písmen, platný cieľ, správne vyhodnotenie podôb',structOk);
    ok('správnych vždy 2–5 ('+cntBad+')',cntBad===0);
    ok('bez dĺžňov a diakritiky ('+diacritics+')',diacritics===0);
    ok('medzi správnymi sú tlačené aj písané podoby',mixPrint&&mixScript);
    ok('pozície správnych sa menia ('+posSets.size+'/30)',posSets.size>10);
    ok('správne nie sú všetky vedľa seba ('+contigCount+')',contigCount===0);

    // interakcia
    window.__game.buildRound();
    const els=()=>$$('#letters .tile');
    const wi=S.tiles.findIndex(t=>!t.ok);
    els()[wi].click(); await sleep(50);
    ok('nesprávne písmeno sa zafarbí červenou',els()[wi].classList.contains('bad'));
    els()[wi].click(); await sleep(50);
    ok('označené písmeno nemožno zmeniť',els()[wi].classList.contains('bad')&&S.tiles[wi].done);
    for(let i=0;i<10;i++){if(S.tiles[i].ok){els()[i].click();await sleep(25)}}
    ok('správne písmená sú zelené',els().every((el,i)=>!S.tiles[i].ok||el.classList.contains('ok')));
    await sleep(260);
    ok('kolo sa dokončí a začne nové (smajlík + dielik)',S.round===2&&document.getElementById('cell0').classList.contains('lit')&&$$('#letters .tile').length===10);

    // celá hra: 10 kôl
    window.__game.newGame(); await sleep(140);
    ok('Nová hra: kolo 1 a prázdna batéria',S.round===1&&!document.getElementById('cell0').classList.contains('lit'));
    for(let r=1;r<=10;r++){
      if($$('#letters .tile').length!==10){ok('kolo '+r+': 10 písmen',false);break}
      if(r===1){const w=S.tiles.findIndex(t=>!t.ok);els()[w].click();await sleep(25)}
      for(let i=0;i<10;i++){if(S.tiles[i].ok){els()[i].click();await sleep(25)}}
      await sleep(150);
    }
    await sleep(300);
    ok('po 10 kolách svieti celá batéria',Array.from({length:10},(_,i)=>document.getElementById('cell'+i)).every(c=>c.classList.contains('lit')));
    ok('batéria blika ako maják',$('battery').classList.contains('full'));
    ok('záverečný efekt + tlačidlo Nová hra',$('finalOverlay').classList.contains('show')&&$('newGameBtn').textContent==='Nová hra'&&$$('#confetti .cf').length>0);
    $('newGameBtn').click(); await sleep(160);
    ok('Nová hra vynuluje batériu aj kolá',S.round===1&&!document.getElementById('cell0').classList.contains('lit')&&!$('finalOverlay').classList.contains('show')&&!$('battery').classList.contains('full')&&$$('#letters .tile').length===10);
  }catch(e){ok('bez výnimky ('+(e&&e.message)+')',false)}

  const fails=lines.filter(l=>l.indexOf('FAIL')===0);
  document.title=fails.length?'SELFTEST-FAIL('+fails.length+')':'SELFTEST-OK';
  const pre=document.createElement('pre');pre.id='testout';pre.textContent='SELFTEST DONE\n'+lines.join('\n');
  document.body.appendChild(pre);
}
const mh=location.search+' '+location.hash;
if(mh.indexOf('selftest')>=0)setTimeout(selftest,300);

/* --- vizuálny demo režim (iba na testovanie vykreslenia) --- */
async function demoFinal(){
  const S=window.__game.S; let guard=0;
  while(!$('finalOverlay').classList.contains('show')&&guard++<300){
    if(!S.locked){for(let i=0;i<10;i++){if(S.tiles[i].ok){$('letters').children[i].click()}}}
    await sleep(150);
  }
}
function demoMid(){
  window.__game.buildRound();
  const S=window.__game.S, box=$('letters');
  let wc=0;
  for(let i=0;i<10&&wc<2;i++){if(!S.tiles[i].ok){box.children[i].click();wc++}}
  const first=S.tiles.findIndex(t=>t.ok);
  for(let i=0;i<10;i++){if(S.tiles[i].ok&&i!==first)box.children[i].click()}
}
if(mh.indexOf('demo=mid')>=0)setTimeout(demoMid,400);
if(mh.indexOf('demo=final')>=0)setTimeout(demoFinal,400);
</script>
